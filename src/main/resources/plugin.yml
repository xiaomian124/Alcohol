name: Alcohol
version: '2.0'
main: com.xiaomian124.alcohol.AlcoholPlugin
api-version: '26.2'
description: Alcohol plugin, enrich your server gaming experience.
author: xiaomian124

commands:
  alcohol:
    description: Alcohol plugin main commands
    usage: /alcohol <recipe|give|reload|kill|refresh|help>

permissions:
  alcohol.recipe:
    description: Allow to use "/alcohol recipe" to view the recipe
    default: true
  alcohol.give:
    description: Allow to use "/alcohol give" get items
    default: op
  alcohol.reload:
    description: Allow to use "/alcohol reload" reload plugin
    default: op
  alcohol.kill:
    description: Allow to use "/alcohol kill" clear leftover entities
    default: op
  alcohol.refresh:
    description: Allow to use "/alcohol refresh" to rebuild item display names
    default: op
